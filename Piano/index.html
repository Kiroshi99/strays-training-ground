
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Strays Rhythm Lock</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="game">

  <h2>STRAYS RHYTHM LOCK</h2>

  <div class="hud">
    <div>
      <div class="score-number" id="scoreTop">0</div>
      <small>SCORE</small>
    </div>

    <div class="stats">
      Best <b id="bestTop">0</b> ·
      Misses <b id="misses">0/3</b> ·
      Wrong <b id="wrong">0/3</b>
    </div>
  </div>

  <div class="stage" id="stage">

    <div class="lanes">
      <div class="lane"></div>
      <div class="lane"></div>
      <div class="lane"></div>
      <div class="lane"></div>
      <div class="lane"></div>
      <div class="lane"></div>
    </div>

    <div id="notes"></div>

    <div class="hit-line" id="hitLine"></div>

    <div class="keyboard">
      <button type="button" data-lane="0">A</button>
      <button type="button" data-lane="1">S</button>
      <button type="button" data-lane="2">D</button>
      <button type="button" data-lane="3">J</button>
      <button type="button" data-lane="4">K</button>
      <button type="button" data-lane="5">L</button>
    </div>

    <div class="overlay active" id="overlay">
      <h2 id="overlayTitle">RHYTHM LOCK</h2>

      <p id="overlayMessage">
        Hit each neon tile as it crosses
        the glowing cyan line.
      </p>

      <button type="button" id="startBtn">
        START GAME
      </button>
    </div>

  </div>

  <div class="bottom-score">
    Score: <b id="scoreBottom">0</b> ·
    Best: <b id="bestBottom">0</b>
  </div>

  <div class="progress">
    <div id="progressFill"></div>
  </div>

  <div class="combo" id="combo">
    Combo: 0 · Max: 0
  </div>

  <p class="instructions">
    Press A, S, D, J, K, L when notes touch the cyan line
  </p>

  <div class="controls">

    <select id="difficulty" aria-label="Difficulty">
      <option value="easy">Easy (1×)</option>
      <option value="normal" selected>Normal (2×)</option>
      <option value="hard">Hard (4×)</option>
    </select>

    <button type="button" id="pauseBtn" disabled>
      Pause
    </button>

    <button type="button" id="restartBtn">
      Restart
    </button>

    <button type="button" id="soundBtn">
      Sound: Off
    </button>

  </div>

</main>

<script src="script.js"></script>

</body>
</html>
